# Same as backspace-basic.toml but using DEL (0x7f) instead of 0x08 -- the
# instructions require both byte values to act as backspace.
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 500000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo hellp\u007Fo\n"

[assert]
uart0_contains = "hello"
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
