# Backspace pressed before anything else is typed (an empty line) must be a
# safe no-op -- not underflow, not corrupt the next characters typed.
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 500000

[[inputs]]
at_tick = 300000
uart = 0
data = "\b\becho ok\n"

[assert]
uart0_contains = "ok"
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
