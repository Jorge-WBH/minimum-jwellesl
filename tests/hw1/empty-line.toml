# A truly blank line (just Enter) is a no-op: no output at all, straight back
# to the next prompt with nothing printed in between. Contrast with
# tests/hw1/echo-no-args.toml, where "echo" with no args still prints a
# newline.
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 800000

[[inputs]]
at_tick = 300000
uart = 0
data = "\n"

[[inputs]]
at_tick = 500000
uart = 0
data = "echo marker\n"

[assert]
uart0_contains = "msh> msh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
