# The error message must report only the first whitespace-delimited word,
# not the whole line.
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 500000

[[inputs]]
at_tick = 300000
uart = 0
data = "foobar baz qux\n"

[assert]
uart0_contains = "command not found: foobar"
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
