# "echo " is 5 bytes, leaving 15 of the 20-byte line budget for the argument.
# Sending 25 'b' characters should truncate the stored line at 15 of them and
# discard the rest (rather than overflowing the buffer), while still staying
# in sync with the '\n' terminator so the *next* command is parsed cleanly
# instead of getting corrupted by leftover bytes from the discarded tail.
image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 800000

[[inputs]]
at_tick = 300000
uart = 0
data = "echo bbbbbbbbbbbbbbbbbbbbbbbbb\n"

[[inputs]]
at_tick = 500000
uart = 0
data = "echo marker2\n"

[assert]
uart0_contains = "marker2"
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
